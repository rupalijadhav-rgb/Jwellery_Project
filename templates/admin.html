<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel | Kalakruti</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="bg-cream">

    <!-- Header Navbar -->
    <nav class="navbar navbar-expand-lg brand-navbar bg-white border-bottom py-3">
        <div class="container">
            <a class="navbar-brand" href="/">
                <span class="brand-title">Kalakruti</span>
                <span class="brand-sub">MAHARASHTRIAN JEWELLERY</span>
            </a>
            <div class="d-flex align-items-center gap-4">
                <a href="/" class="nav-item-link">Home</a>
                <a href="/admin" class="nav-item-link active">Admin Panel</a>
            </div>
        </div>
    </nav>

    <div class="container py-5">
        <p class="text-muted text-uppercase tracking-wide small mb-1">CATALOGUE MANAGEMENT</p>
        <h1 class="font-serif fw-bold mb-4">Admin Panel</h1>

        <div class="row g-4">
            <!-- Form Card matching screenshot -->
            <div class="col-lg-4">
                <div class="card border-0 shadow-sm p-4 rounded-3 bg-white">
                    <h5 class="font-serif fw-bold mb-4">Add New Product</h5>
                    <form id="add-product-form">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Name</label>
                            <input type="text" id="p-name" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Category</label>
                            <select id="p-category" class="form-select text-capitalize" required>
                                {% for cat in categories %}
                                    <option value="{{ cat }}">{{ cat }}</option>
                                {% endfor %}
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Price (₹)</label>
                            <input type="number" id="p-price" class="form-control" value="0" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Material specs</label>
                            <input type="text" id="p-material" class="form-control" placeholder="22K Gold Plated · Pearls">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Description</label>
                            <textarea id="p-desc" class="form-control" rows="3"></textarea>
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-muted">Image URL or Path</label>
                            <input 
                                type="text" 
                                id="p-image" 
                                class="form-control" 
                                placeholder="https://..."
                                required>
                        </div>
                        <button type="submit" class="btn btn-maroon w-100 py-2">Add Product</button>
                    </form>
                </div>
            </div>

            <!-- Table Card matching screenshot -->
            <div class="col-lg-8">
                <div class="card border-0 shadow-sm p-4 rounded-3 bg-white">
                    <div class="d-flex justify-content-between align-items-center mb-3">
                        <h5 class="font-serif fw-bold mb-0">Catalogue (<span id="admin-count">0</span>)</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="loadAdminCatalogue()"><i class="bi bi-arrow-clockwise"></i> RESET</button>
                    </div>
                    <div class="table-responsive">
                        <table class="table align-middle">
                            <thead class="table-light text-uppercase small text-muted">
                                <tr>
                                    <th>PRODUCT</th>
                                    <th>CATEGORY</th>
                                    <th>PRICE</th>
                                    <th>STOCK</th>
                                    <th class="text-end">ACTIONS</th>
                                </tr>
                            </thead>
                            <tbody id="admin-table-body">
                                <!-- Dynamic Rows -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/admin.js') }}"></script>
</body>
</html>
